#
# THE SECRET SCANNER, AND THE ONE PLACE IT IS TOLD SOMETHING IT CANNOT KNOW.
#
# Everything the default ruleset does still applies everywhere. This file adds exactly one
# exemption, and it is deliberately the narrowest one that resolves the problem.
#
# `corpus/documents/` is ADOPTED CONTENT (ADR-0004): HashiCorp's published documentation,
# fetched by `infra/bin/corpus_sync.py` and stored verbatim so that a citation resolves to
# what the vendor actually wrote and the corpus digest means something. Their documentation
# contains their own example values — an initial-admin token in a Terraform Enterprise setup
# URL, elided recovery keys in a `vault operator init` transcript, a
# `<hvs-TOKEN-value-from-key-ceremony>` placeholder. Fourteen of them tripped the entropy
# heuristic on the 035 sync.
#
# Nothing of ours is ever written here — the directory is machine-populated from public pages
# and nothing else may write to it. That is the whole basis for the exemption, and if it ever
# stops being true this file becomes wrong rather than merely generous.
#
# EDITING THE DOCUMENTS WAS THE OTHER OPTION AND IT IS WORSE. Redacting a vendor's own example
# would make our copy differ from the page it cites, break the digest that proves we did not
# alter what we adopted, and be silently undone by the next sync.
#
# Scoped by RULE as well as by path. `generic-api-key` is the entropy heuristic — the one that
# cannot tell an example from a credential. Every specific rule (private keys, AWS keys, GitHub
# and Slack tokens, and the rest) still fires inside this directory, so a real credential of a
# recognised shape appearing in adopted content is still a failure.

[extend]
useDefault = true

# THE SECOND EXEMPTION (043) rides in the SAME rule block, because two [[rules]] entries with
# one id would leave whichever parses last holding the only allowlist. Within one allowlist the
# conditions are OR'd: the corpus path OR this one regex.
#
# The regex, and why it is a regex rather than a path: `specs/043-.../data-model.md` wrote the
# prose `(its own key, qualified_by="fixture")` — "key" beside a quoted value, and the entropy
# heuristic read design prose as a credential. This repository has counted five of its own
# checks matching prose instead of code; this is the vendor's turn. NOT a path exemption for
# `specs/`: specs are ours, and a real secret pasted into one must still fail. The allowlist
# admits exactly the benign token that fired — a matrix cell's provenance field — and nothing
# else. Rewording alone would not clear it, because the scanner walks the commit RANGE and the
# original commit carries the string forever.
#
# `infra/bin/seed-dev-claim-mapping.py` briefly named the derived Vault KV record
# `MAPPING_KEY = "operator-<digest>"`. That string is the output of `mapping_key()`, not a
# credential — the script now derives it at runtime instead.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
paths = ['''corpus/documents/.*\.json''']
regexes = [
  '''qualified_by\s*=\s*"fixture"''',
  '''MAPPING_KEY\s*=\s*"operator-[0-9a-f]{16}"''',
]
regexTarget = "line"
