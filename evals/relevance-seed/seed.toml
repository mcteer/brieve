# SPDX-License-Identifier: Apache-2.0
#
# THE ROOT OF THE RELEVANCE JUDGE'S CHAIN (043, FR-014/FR-015).
#
# ADR-0052 ends the judge regress at cases checked in and reviewed like code. 043 adds a judge,
# so it adds a root, and this is it.
#
# WHAT A LABEL MEANS. For each claim: does this statement answer THE QUESTION ASKED? Not "is it
# true" — every statement here is true and every citation resolves against the pin. That is the
# whole point. The defect this feature exists to close is an answer assembled from true, cited,
# resolving claims about something else.
#
# WHY `author` IS REQUIRED. It records who DRAFTED, so a reviewer can see whose judgement they
# are inheriting. ADR-0052 settles the rest: seed cases "may be drafted by anyone — including
# the harness — and become authoritative when the sole maintainer reviews and merges them."
# The regress terminates at review, not at authorship. These were drafted by the harness and
# become the standard when they are merged.
#
# THE THREE SHAPES THE FLOOR REQUIRES:
#   supported-but-irrelevant — every claim true, cited, resolving, and about the wrong subject.
#                              These ARE the defect. A set without them qualifies a judge on
#                              verdicts the failure never presents.
#   fully-relevant           — every claim answers the question. Without these a judge measured
#                              only on refusing would be qualified to refuse everything.
#   mixed                    — some of each. Partial keep is a real outcome and a judge that
#                              only answers all-or-nothing has not been measured on it.

# =============================================================================================
# SUPPORTED BUT IRRELEVANT — the defect's own shape.
# =============================================================================================

# The case that started all of this: 0g, and the reason the live lane went red.
[[cases]]
id = "this-platforms-audit-retention"
question = "What is the recommended retention period for this platform's audit log?"
author = "Claude Opus 5 (harness)"
note = """
The motivating case. The pinned corpus is HashiCorp product documentation and contains nothing
about this platform, so no answer to this question can be grounded in it. Every claim below is
true and cited; none is about what was asked.
"""

[[cases.claims]]
statement = "HCP Terraform retains audit trail records for 14 days before discarding them."
citation = "/validated-designs/terraform-operating-guides-adoption/observability#hcp-terraform-audit-trail-logs"
verdict = "irrelevant"

[[cases.claims]]
statement = "Boundary audit events should be retained for a period sufficient to satisfy applicable regulation."
citation = "/validated-designs/boundary-operating-guides-standardization/audit-logs#retention"
verdict = "irrelevant"

[[cases]]
id = "this-platforms-backup-schedule"
question = "How often does this platform back up its own state?"
author = "Claude Opus 5 (harness)"
note = "Same shape, different subject: real backup guidance, for a product that is not us."

[[cases.claims]]
statement = "Vault's standard backup procedure covers automated snapshots for clusters with disaster recovery replication enabled."
citation = "/validated-designs/vault-operating-guides-adoption/standard-operational-procedures#backup-standard-procedure"
verdict = "irrelevant"

[[cases]]
