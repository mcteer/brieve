# SPDX-License-Identifier: Apache-2.0

[project]
name = "harness"
version = "0.0.0"
description = "Governed runtime for AI agents operating infrastructure products"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# Runtime deps justified by specs/002-governed-core/research.md (Principle VI):
# pydantic — boundary validation (CONTRIBUTING); opentelemetry-api — ADR-0020 spans.
# Floors raised to match the `adapters` extra (pydantic-ai-slim requires pydantic>=2.12
# and opentelemetry-api>=1.28) so with-extra and without-extra environments resolve the
# same versions — specs/004-primary-adapter/research.md.
# Postgres driver, a BASE dependency rather than an extra: the durability conformance
# rows are merge-blocking and run against Postgres, so an extra CI might not install
# would green the wrong thing (specs/005-durable-execution, T001).
#
# pg8000, not psycopg. psycopg 3 was the plan's default choice and is the better-known
# driver, but it is LGPL-3.0-only, which this repository refuses twice over: it is
# absent from licenses/allowlist.txt, and scripts/check-licenses.sh hard-denies the GPL
# family as a second belt. Taking it would mean weakening a governance control to
# accommodate a dependency, which is backwards. pg8000 is BSD-3-Clause, pure Python
# (no libpq to install), and DB-API 2.0.
dependencies = [
    "opentelemetry-api>=1.28",
    "pg8000==1.31.5",
    "pydantic>=2.12",
]

# Primary adapter (ADR-0017), optional so the framework stays out of the core install.
# Slim, not the `pydantic-ai` meta package: the meta resolves to
# pydantic-ai-slim[anthropic,cli,evals,google,logfire,mcp,openai,retries,web], installing
# three live model-provider SDKs for a feature that calls no model (Principle VI, FR-012).
[project.optional-dependencies]
adapters = [
    "pydantic-ai-slim==2.18.0",
    # THE VENDOR SDK, moved here from `evals` by 027 — and the move is the fix for a defect
    # that would have appeared only in a deployed allocation.
    #
    # Until 027 no production path called a vendor: `served.py` wired no provider and every
    # matrix cell was a fixture, so the SDK really was eval-only. That stopped being true the
    # moment a served surface brokered a credential and built a provider. The mcp-surface and
    # agent-run jobspecs install `--extra adapters --extra surfaces` and NOT `--extra evals`, so
    # with the SDK left where it was, the first deployed ask would have fetched its credential,
    # resolved its cell, and then failed at `import anthropic` with a message telling the
    # operator to install an eval extra — a live-lane error reported to somebody running the
    # product, at the last step, after everything else worked.
    #
    # `pydantic-ai-slim` needs it too as of 027: the run path constructs an explicit
    # `AnthropicProvider` so the brokered key travels as an argument rather than as process
    # state, and that import is unavailable without this package.
    "anthropic==0.120.2",
]

# Code-mode sandbox (ADR-0041, 036), optional so the base install never grows a Rust
# interpreter for a capability most runs do not use (Principle VI — a library behind an
# extra is not an operated component, so no named-trigger ADR is owed).
#
# THE DISTRIBUTION IS `pydantic-monty`, NOT `monty`, and the difference is a supply-chain
# trap rather than a naming preference. PyPI `monty` is an unrelated materials-science
# package from the pymatgen ecosystem ("Monty is the missing complement to Python",
# 2026.7.16); `uv add monty` installs it without error and nothing downstream complains
# until the import fails. ADR-0004's identified-content discipline applies to a runtime
# dependency exactly as it applies to a document, so the name is asserted by a unit gate
# (`tests/unit/test_sandbox_dependency_identity.py`) and not merely written correctly once.
#
# Pinned EXACT rather than floored. Upstream is 0.0.x by its own versioning and moved
# 0.0.17 -> 0.0.19 in the week around ADR-0054; its banner reads "Experimental — not ready
# for prime time". The platform owns the sandbox seam (FR-014a) precisely so this runtime
# is replaceable, and an exact pin is what makes a version move a deliberate act.
sandbox = [
    "pydantic-monty==0.0.19",
]

# Northbound API surface (ADR-0033), optional so the core install stays free of a web
# framework. Deliberately an EXTRA and not a base dependency, which is the opposite call
# from pg8000 above: pg8000 is imported by `core` itself, so making it optional would make
# core optional. FastAPI and PyJWT are imported only by `src/surfaces`, which is exactly
# what an extra is for — Principle I's "the core never imports an agent framework"
# generalises to not acquiring a web framework in the core install either.
# Every recipe in the Makefile names `--extra surfaces` so no gate can run without it.
#
# FastAPI rather than Starlette alone or stdlib http.server: FR-012 requires the operation
# description be generated from the implementation rather than maintained beside it, and
# FastAPI derives its OpenAPI document from the same signatures and Pydantic models that
# validate requests. There is one thing to maintain, not two.
# PyJWT rather than a hand-rolled verifier: a JWT check that accepts `alg: none` or fails to
# pin the algorithm fails OPEN and passes every test anyone thinks to write.
surfaces = [
    "mcp==1.28.1",
    "fastapi==0.140.7",
    "pyjwt[crypto]==2.13.0",
    "uvicorn==0.51.0",
]

# The portal surface (ADR-0034, 012). An extra for the same reason `surfaces` is one:
# jinja2 is imported only by `src/surfaces/portal`, and the core install must not acquire
# a template engine. Deliberately absent from this list: any JS build toolchain, any SPA
# framework, and any HTTP client — the portal's relay uses urllib, as the enclave readers
# already do, so the thin-client rule stays auditable by reading rather than by trusting.
portal = [
    "jinja2==3.1.6",
]

# The accessibility gate (012, FR-020a). Dev-lane only, never operated: playwright drives
# a real browser over the rendered client because a WCAG assertion is about a rendered
# interface, which no process-only lane can see. The axe-core ruleset is VENDORED at a
# pinned version in tests/a11y/vendor rather than fetched — what the gate executes is
# pinned (Principle VIII), and a gate whose ruleset drifts silently is a gate whose
# meaning drifts silently.
a11y = [
    "playwright==1.58.0",
]

# The eval gates (013, Principle VIII). An extra, and the reason is stronger here than for
# any other extra in this file: the description at the top of this project says the platform
# is a governed runtime, and until this feature it CALLED NO MODEL AT ALL — the `adapters`
# comment above records refusing the pydantic-ai meta package precisely because it would
# have installed three provider SDKs "for a feature that calls no model". That posture is
# worth keeping for everyone who is not running the live lane, so the SDK arrives only with
# this extra and the base install still calls nothing.
#
# The scoring harness itself is in-repo (`core/evals/scoring.py`) and needs no dependency —
# `FixtureScorer` replays a recording and imports nothing. Only `LiveModelScorer` needs the
# SDK, which is why one marked, non-blocking lane carries the whole of this cost.
#
# anthropic, MIT, and the only provider SDK here: `make evals` (fixtures) is the blocking
# lane and never imports it. A second provider would be a second thing to keep qualified
# without a second thing to qualify it for.
# The vendor SDK now lives in `adapters` (see the note there — a deployed surface calls a
# vendor as of 027, so it is no longer an eval-only dependency). This extra names it through
# `adapters` rather than pinning it a second time: two pins for one package drift, and the
# version that matters is the one the product uses.
evals = [
    "harness[adapters]",
]


[dependency-groups]
dev = [
    "mypy>=1.14",
    "opentelemetry-sdk>=1.27",
    "pip-licenses>=5.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "adapters*", "surfaces*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

# The accessibility lane's driver is not installed in the inner loop, deliberately: it
# pulls a browser toolchain that only `make a11y` and its CI job need, and making every
# `make check` carry it would be a heavy dependency for one lane's benefit. mypy still
# typechecks tests/a11y — the fixtures are `Any` at the boundary anyway, so what is lost is
# stub-level checking of playwright's own API, not of this repository's code.
[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

# The same shape for the live-eval lane's provider SDK, and the reason is stronger here: the
# platform's default posture is "calls no model", so `anthropic` deliberately lives in the
# `evals` extra and no base lane installs it. `make check` must typecheck
# `adapters/anthropic_scorer.py` without it — CI's fast-lane found this when my own venv had
# the extra installed and resolved the import locally, which is a green that came from the
# environment rather than from the code.
#
# What is lost is stub-level checking of the SDK's own API; what is kept is every line of
# this repository's code in that module. The alternative — adding `--extra evals` to the
# inner loop — would install a provider SDK into the lane whose whole claim is that it needs
# none.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

# The sandbox runtime (036), for the same reason and with a sharper edge: code mode is
# OPTIONAL by design, and FR-013 requires the platform to refuse with a stated reason where
# the runtime is absent. So `sandbox_runtime.py` must typecheck in an environment that does
# not have it — which is exactly the environment the refusal exists for. Without this
# override the module only typechecks where the capability is installed, and the
# absent-runtime path would be the one nothing ever verified.
[[tool.mypy.overrides]]
module = "pydantic_monty.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/component"]
pythonpath = ["src", "."]
markers = [
    # Requires the local enclave (`make dev-up`). Excluded from `make check` so the
    # fork-safe CI lane stays hermetic; included in `make conformance`, which is the
    # gate a human runs against the real stack.
    "enclave: needs a running Vault and Postgres",
    # Needs the enclave AND must run on the HOST rather than inside an allocation.
    # Two reasons, both structural rather than incidental: a row that drives the scheduler
    # cannot run inside something the scheduler placed, and a row that sets up a Control
    # Group needs an admin token the allocation deliberately does not have — no token in
    # that jobspec is the property it exists to demonstrate.
    "host_enclave: needs the enclave, and cannot run inside an allocation",
    # Scores a REAL model through a provider SDK. Never in a blocking lane, and the two
    # reasons are different from every other marker here: it needs a paid credential, and
    # it is non-deterministic. A merge gate carrying either fails for reasons unrelated to
    # the change under review, and a gate that fails for unrelated reasons is one people
    # learn to re-run rather than read. `make evals` scores fixtures and blocks; this lane
    # is `make evals-live` and has a named runner (plan.md, SC-013).
    "live_model: scores a live model; needs a provider credential and costs money",
]

# No mypy override is needed for the `surfaces` extra: fastapi, uvicorn, pyjwt, and
# starlette all ship a py.typed marker (checked, specs/008-northbound-api T004). An
# override for a typed package would silently weaken `strict` for that module, so the
# absence of one here is deliberate rather than an oversight.

[[tool.mypy.overrides]]
# pg8000 ships no py.typed marker. The provider wraps it behind typed methods, so the
# untyped surface stops at the module boundary rather than leaking into core.
module = ["pg8000.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML ships no stubs, and `types-PyYAML` is not worth a dependency for one test.
#
# `yaml` arrives transitively (pre-commit, the terraform tooling) and is read by exactly one
# module: `tests/unit/test_workflow_files_are_valid.py`, which parses `.github/workflows/*`
# to prove GitHub will accept them. It reaches no production code and no run path — the
# platform's own config is TOML and HCL — so the untyped surface stops at that one file.
module = ["yaml.*"]
ignore_missing_imports = true
