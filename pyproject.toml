# SPDX-License-Identifier: Apache-2.0

[project]
name = "harness"
version = "0.0.0"
description = "Governed runtime for AI agents operating infrastructure products"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# Runtime deps justified by specs/002-governed-core/research.md (Principle VI):
# pydantic — boundary validation (CONTRIBUTING); opentelemetry-api — ADR-0020 spans.
# Floors raised to match the `adapters` extra (pydantic-ai-slim requires pydantic>=2.12
# and opentelemetry-api>=1.28) so with-extra and without-extra environments resolve the
# same versions — specs/004-primary-adapter/research.md.
# Postgres driver, a BASE dependency rather than an extra: the durability conformance
# rows are merge-blocking and run against Postgres, so an extra CI might not install
# would green the wrong thing (specs/005-durable-execution, T001).
#
# pg8000, not psycopg. psycopg 3 was the plan's default choice and is the better-known
# driver, but it is LGPL-3.0-only, which this repository refuses twice over: it is
# absent from licenses/allowlist.txt, and scripts/check-licenses.sh hard-denies the GPL
# family as a second belt. Taking it would mean weakening a governance control to
# accommodate a dependency, which is backwards. pg8000 is BSD-3-Clause, pure Python
# (no libpq to install), and DB-API 2.0.
dependencies = [
    "opentelemetry-api>=1.28",
    "pg8000==1.31.5",
    "pydantic>=2.12",
]

# Primary adapter (ADR-0017), optional so the framework stays out of the core install.
# Slim, not the `pydantic-ai` meta package: the meta resolves to
# pydantic-ai-slim[anthropic,cli,evals,google,logfire,mcp,openai,retries,web], installing
# three live model-provider SDKs for a feature that calls no model (Principle VI, FR-012).
[project.optional-dependencies]
adapters = [
    "pydantic-ai-slim==2.18.0",
]

# Northbound API surface (ADR-0033), optional so the core install stays free of a web
# framework. Deliberately an EXTRA and not a base dependency, which is the opposite call
# from pg8000 above: pg8000 is imported by `core` itself, so making it optional would make
# core optional. FastAPI and PyJWT are imported only by `src/surfaces`, which is exactly
# what an extra is for — Principle I's "the core never imports an agent framework"
# generalises to not acquiring a web framework in the core install either.
# Every recipe in the Makefile names `--extra surfaces` so no gate can run without it.
#
# FastAPI rather than Starlette alone or stdlib http.server: FR-012 requires the operation
# description be generated from the implementation rather than maintained beside it, and
# FastAPI derives its OpenAPI document from the same signatures and Pydantic models that
# validate requests. There is one thing to maintain, not two.
# PyJWT rather than a hand-rolled verifier: a JWT check that accepts `alg: none` or fails to
# pin the algorithm fails OPEN and passes every test anyone thinks to write.
surfaces = [
    "fastapi==0.140.7",
    "pyjwt[crypto]==2.13.0",
    "uvicorn==0.51.0",
]


[dependency-groups]
dev = [
    "mypy>=1.14",
    "opentelemetry-sdk>=1.27",
    "pip-licenses>=5.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "adapters*", "surfaces*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/component"]
pythonpath = ["src", "."]
markers = [
    # Requires the local enclave (`make dev-up`). Excluded from `make check` so the
    # fork-safe CI lane stays hermetic; included in `make conformance`, which is the
    # gate a human runs against the real stack.
    "enclave: needs a running Vault and Postgres",
]

# No mypy override is needed for the `surfaces` extra: fastapi, uvicorn, pyjwt, and
# starlette all ship a py.typed marker (checked, specs/008-northbound-api T004). An
# override for a typed package would silently weaken `strict` for that module, so the
# absence of one here is deliberate rather than an oversight.

[[tool.mypy.overrides]]
# pg8000 ships no py.typed marker. The provider wraps it behind typed methods, so the
# untyped surface stops at the module boundary rather than leaking into core.
module = ["pg8000.*"]
ignore_missing_imports = true
