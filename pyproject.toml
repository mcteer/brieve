# SPDX-License-Identifier: Apache-2.0

[project]
name = "harness"
version = "0.0.0"
description = "Governed runtime for AI agents operating infrastructure products"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# Runtime deps justified by specs/002-governed-core/research.md (Principle VI):
# pydantic — boundary validation (CONTRIBUTING); opentelemetry-api — ADR-0020 spans.
# Floors raised to match the `adapters` extra (pydantic-ai-slim requires pydantic>=2.12
# and opentelemetry-api>=1.28) so with-extra and without-extra environments resolve the
# same versions — specs/004-primary-adapter/research.md.
# psycopg is a BASE dependency, not an extra: the durability conformance rows are
# merge-blocking and run against Postgres, so an extra that CI might not install would
# green the wrong thing (specs/005-durable-execution, T001). psycopg 3, not psycopg2 —
# the v3 API is what the provider and its credential-refresh path are written against.
# `[binary]` ships libpq, so contributors need no system package.
dependencies = [
    "opentelemetry-api>=1.28",
    "psycopg[binary]==3.3.4",
    "pydantic>=2.12",
]

# Primary adapter (ADR-0017), optional so the framework stays out of the core install.
# Slim, not the `pydantic-ai` meta package: the meta resolves to
# pydantic-ai-slim[anthropic,cli,evals,google,logfire,mcp,openai,retries,web], installing
# three live model-provider SDKs for a feature that calls no model (Principle VI, FR-012).
[project.optional-dependencies]
adapters = [
    "pydantic-ai-slim==2.18.0",
]


[dependency-groups]
dev = [
    "mypy>=1.14",
    "opentelemetry-sdk>=1.27",
    "pip-licenses>=5.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "adapters*", "surfaces*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/component"]
pythonpath = ["src", "."]
