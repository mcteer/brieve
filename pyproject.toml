# SPDX-License-Identifier: Apache-2.0

[project]
name = "harness"
version = "0.0.0"
description = "Governed runtime for AI agents operating infrastructure products"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# Runtime deps justified by specs/002-governed-core/research.md (Principle VI):
# pydantic — boundary validation (CONTRIBUTING); opentelemetry-api — ADR-0020 spans.
dependencies = [
    "opentelemetry-api>=1.27",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "opentelemetry-sdk>=1.27",
    "pip-licenses>=5.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "adapters*", "surfaces*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/component"]
pythonpath = ["src", "."]
