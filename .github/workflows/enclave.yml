# SPDX-License-Identifier: Apache-2.0
#
# Enclave lane (specs/009-mcp-surface, US6) — the automated runner the enclave-dependent
# conformance rows have never had.
#
# The constitution requires a blocking row with no automated runner to name who runs it.
# 005 named the agent harness for seven durability rows; 008 named it again for nine more.
# That naming was honest and it was still an instruction being followed rather than a
# control. This is the control.
#
# WHY NOT `pull_request_target`: it would let this lane run for fork pull requests, which
# is the only way to give a fork's rows automated coverage. It does so by running
# base-branch workflows with secrets available while the FORK controls the code under
# test — handing a Vault Enterprise licence and a live enclave to arbitrary pull requests.
# That trades a coverage gap for a credential-disclosure one, which is the wrong direction.
#
# So fork pull requests get the fork-safe fast lane (ci.yml) and their enclave rows are run
# by a maintainer. That is today's situation for every contributor, narrowed to a much
# smaller set of pull requests.

name: enclave

# NO LONGER ON EVERY PULL REQUEST — 2026-08-01.
#
# This lane stood a whole enclave up inside GitHub for each change: Vault, Nomad, Terraform,
# Postgres, five services, and every conformance row. It worked, and it was the wrong shape.
#
# **A real enclave on a maintainer's machine is better evidence than a synthetic one**, not
# worse. The rows are identical — the same `make conformance` a person runs — so what CI added
# was insistence, not coverage, and it added it at the cost of a second environment to keep
# alive. It began failing for reasons about the runner rather than the platform: a job that
# could not be placed because five services already held the runner's cores.
#
# **What this gives up, stated plainly.** Two defects in one day were COMPOSITION failures,
# visible only when everything ran together — a surface two lanes both claimed to own, and a
# reservation that fit an empty runner and not a full one. Running lanes one at a time locally
# would have shown neither. So `make conformance` in full, before merge, is now a person's
# responsibility rather than a machine's.
#
# The constitution already anticipates exactly this: a blocking row no automated check executes
# MUST have a named party responsible before merge. That party is named in each feature's
# conformance contract. This is not a weakening of the gate; it is the model the constitution
# describes, with the lane kept available on demand.
on:
  # Still runnable, deliberately: `gh workflow run enclave.yml` when a change warrants a clean
  # substrate, and the capability is worth keeping even when it is not compulsory.
  workflow_dispatch:
  # Manual runs, so a maintainer can exercise the lane without opening a pull request —
  # and so its first run could answer T002 (does the enclave come up on a Linux runner at
  # all) before anything was built on the assumption that it does.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned by version AND checksum. An unpinned install makes this lane's result depend on
  # whatever upstream published this morning, which is the opposite of a gate.
  NOMAD_VERSION: "2.0.4"
  VAULT_VERSION: "2.0.3+ent"
  TERRAFORM_VERSION: "1.15.8"

jobs:
  enclave:
    name: enclave
    # Fork pull requests cannot reach secrets at all, so the job would fail obscurely at
    # the licence step. Skipping explicitly says why (FR-019).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Generous, because the lane pulls images and installs a virtualenv inside an
    # allocation. Not unbounded: a hung bring-up must fail rather than burn the runner.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The scope step below diffs against the base, which depth-1 cannot reach.
          fetch-depth: 0

      # WHETHER THIS CHANGE COULD POSSIBLY AFFECT THE STACK — decided by asking the tests.
      #
      # The obvious version is `paths-ignore: [specs/**, docs/**]`, and it is wrong here.
      # Twelve test files read `specs/`, several of them enclave rows: 018's
      # `test_a_run_cannot_move_its_own_bounds.py` asserts that its conformance contract
      # still records the limits its rows depend on, so editing that markdown turns an
      # enclave row red. A path allowlist would skip exactly the lane that catches
      # documentation regressions.
      #
      # `paths-the-tests-read` derives the answer instead, and fails closed everywhere: a
      # code path, an unrecognised root, a path any test so much as names, an unreadable
      # source, a crash, or no diff at all — all mean RUN. Only a positively established
      # `skip` skips.
      #
      # **The job still runs and still reports.** A skipped GitHub job reports as skipped,
      # which branch protection treats differently from a pass and which reads to a human
      # as "did not happen". This short-circuits inside the job instead, so the check is
      # green, present, and says why in its own log.
      - name: Scope — can this change reach the stack?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
            echo "not a pull request — running"
            exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
            echo "could not diff $BASE..$HEAD — failing closed and running"
            exit 0
          fi
          echo "changed files:"; printf '  %s\n' $changed
          # Unquoted on purpose: one path per argument is what the script requires, and it
          # refuses an argument containing whitespace rather than trusting it.
          verdict=$(python3 infra/bin/paths-the-tests-read $changed 2>/tmp/why || echo run)
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "verdict: ${verdict} — $(cat /tmp/why)"

      - name: Install uv
        if: steps.scope.outputs.verdict != 'skip'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      # Docker is already on the runner. Nomad, Vault, and Terraform are not, and
      # `enclave-up` refuses without all three on PATH.
      - name: Install HashiCorp tooling
        if: steps.scope.outputs.verdict != 'skip'
        run: |
          set -euo pipefail
          install_hashicorp() {
            name="$1"; version="$2"
            # '+ent' is legal in a version string and not in a URL path component.
            encoded="${version//+/%2B}"
            base="https://releases.hashicorp.com/${name}/${version}"
            zip="${name}_${version}_linux_amd64.zip"
            curl -fsSL -o "/tmp/${name}.zip" "${base}/${zip//+/%2B}"
            curl -fsSL -o "/tmp/${name}.sums" "${base}/${name}_${encoded}_SHA256SUMS"
            ( cd /tmp && grep " ${zip}\$" "${name}.sums" | sed "s| ${zip}| ${name}.zip|" | sha256sum -c - )
            sudo unzip -o -q "/tmp/${name}.zip" -d /usr/local/bin
            # Not `| head -1`. Terraform prints more than one line, `head` closes the pipe
            # after the first, and the writer takes SIGPIPE — which under `set -e` fails
            # the step with exit 141 and a log showing three successful installs. It went
            # green for several runs first, because whether the writer has flushed before
            # `head` exits is a race.
            printf '%s\n' "$("${name}" version 2>/dev/null | sed -n 1p)"
          }
          install_hashicorp nomad "${NOMAD_VERSION}"
          install_hashicorp vault "${VAULT_VERSION}"
          install_hashicorp terraform "${TERRAFORM_VERSION}"

      # Nomad allocations run with host networking and reach the trust store and state
      # store at `host.docker.internal`. Docker Desktop provides that name; Linux Docker
      # does not, so the runner needs it explicitly. The Vault container gets it through
      # `host-gateway` in the substrate module — this is the other half, for workloads
      # that share the host's resolver rather than a container's.
      #
      # This is what 009's T002 existed to find: the enclave does not come up unmodified
      # on a Linux runner, and the reason is a Docker Desktop convenience baked into how
      # containers address the host.
      - name: Make host.docker.internal resolvable
        if: steps.scope.outputs.verdict != 'skip'
        run: |
          set -euo pipefail
          echo '127.0.0.1 host.docker.internal' | sudo tee -a /etc/hosts >/dev/null
          getent hosts host.docker.internal

      # `enclave-up` reads the licence from .env, not the environment — so the lane writes
      # one. The value is written UNQUOTED: `env_val` strips surrounding quotes, but 006
      # paid for the case where they survive, and Vault then rejects the licence with
      # "error decoding version: expected integer", which names the version and not the
      # quoting that caused it.
      - name: Write the environment file
        if: steps.scope.outputs.verdict != 'skip'
        env:
          VAULT_ENT_LICENSE: ${{ secrets.VAULT_ENT_LICENSE }}
        run: |
          set -euo pipefail
          if [ -z "${VAULT_ENT_LICENSE}" ]; then
            echo "::error::VAULT_ENT_LICENSE is not set. The enclave lane cannot run without it." >&2
            exit 1
          fi
          # printf, not echo, and no surrounding quotes. Written with `set +x` already the
          # default; the value is never echoed.
          printf 'VAULT_ENT_LICENSE=%s\n' "${VAULT_ENT_LICENSE}" > .env
          printf 'HARNESS_DEFAULT_TENANT=%s\n' "tenant-ci" >> .env
          # Prove the file has what it needs without printing what it contains.
          grep -q '^VAULT_ENT_LICENSE=.' .env || { echo "::error::licence did not reach .env" >&2; exit 1; }
          echo "wrote .env with a licence of ${#VAULT_ENT_LICENSE} characters"

      # The same command a human runs. Principle VII: two ways to run the gate is two
      # gates, and the one nobody runs locally is the one that rots.
      # Linux Docker: the trust store joins the host namespace rather than being bridged.
      # See infra/modules/substrate-docker/variables.tf for why this is a substrate
      # difference — Principle VII's only permitted kind — and not a fix applied everywhere.
      - name: Stand up the enclave
        if: steps.scope.outputs.verdict != 'skip'
        env:
          ENCLAVE_VAULT_HOST_NETWORK: "true"
        run: make dev-up

      - name: Conformance (all rows)
        if: steps.scope.outputs.verdict != 'skip'
        run: make conformance

      # A failure to bring the enclave up must read as a failure, never a pass or a skip
      # (FR-020). `set -e` in the steps above gives that; this makes the intent legible to
      # anyone reading the lane rather than inferring it from shell semantics.
      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::enclave lane failed — this blocks the merge. A lane that cannot" \
                 "stand the stack up reports failure; it never reports a pass."
            exit 1
          fi
          # A SKIPPED LANE MUST NOT REPORT THAT ROWS PASSED. It said exactly that before this
          # step learned about scoping, which would have been a false green of the precise
          # kind the rest of this file exists to prevent — worse than the lane not running,
          # because it asserts something no runner established.
          if [ "${{ steps.scope.outputs.verdict }}" = "skip" ]; then
            echo "::notice::enclave lane SKIPPED — every changed path is documentation that" \
                 "no test reads. NO ROWS RAN. Derived by infra/bin/paths-the-tests-read," \
                 "which fails closed: any code path, any path a test so much as names, or" \
                 "any error means the lane runs."
            exit 0
          fi
          echo "enclave rows passed under an automated runner"
