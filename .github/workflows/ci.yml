# SPDX-License-Identifier: Apache-2.0
# Fast lane (FR-006): fork-safe — uses only GITHUB_TOKEN (automatic); no required secrets.

name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  fast-lane:
    name: fast-lane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        # `sandbox` carries the code-mode runtime. Without it the rows that verify
        # ADR-0041's per-call parity gate cannot run HERE, where they are
        # merge-blocking — and a gate asserted only on a maintainer's laptop is the
        # shape this repository refuses (036).
        run: uv sync --frozen --extra adapters --extra surfaces --extra sandbox

      - name: Inner-loop check
        run: make check

      # FR-015: adapter conformance is merge-blocking here, not attested in a PR body.
      #
      # The DURABILITY rows are deliberately absent from this lane: they run against a
      # real Vault Enterprise and Postgres, and this lane is fork-safe with no required
      # secrets, so it cannot stand one up. That is a genuine coverage gap rather than a
      # decision that those rows matter less — see
      # specs/005-durable-execution/contracts/conformance-durability.md. They are not
      # skipped silently; they simply are not run here, and `make conformance` (which
      # does run them) is the gate a human must pass locally.
      # R9 in 043 asserts "no answering eval case was edited" as a DIFF from the merge-base,
      # so it needs the trunk resolvable. `actions/checkout` leaves it as a remote-tracking
      # ref only — the row asked for a local `main`, passed on a developer's clone and failed
      # here with an empty baseline. The row now tries `origin/<base>` too; this fetch is the
      # same guard the spec-lint step already carries, for fork PRs and shallow clones.
      - name: Fetch the trunk, so diff-from-baseline rows have a baseline
        run: git fetch --no-tags origin "${{ github.base_ref || 'main' }}" 2>/dev/null || true

      - name: Conformance (hermetic rows)
        run: make conformance-hermetic

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: DCO sign-off
        uses: christophebedard/dco-check@7b0205d25ead0f898e0b706b58227dd5fa7e3f55 # 0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: License compliance
        run: bash scripts/check-licenses.sh

      - name: Spec-artifact lint (when specs/ changes)
        run: |
          set -euo pipefail
          # Fetch base for accurate diff on fork PRs / shallow clones
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
          mapfile -t changed < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'specs' || true)
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No specs/ changes; skipping spec lint"
            exit 0
          fi
          bash scripts/check-specs.sh "${changed[@]}"

  # ------------------------------------------------------------------ 012
  # The accessibility gate. **Its own job**, not a step in fast-lane, because it is its own
  # discipline: every other gate here asserts something about a process, and this one
  # asserts something about a rendered interface. It needs a browser, it takes longer, and
  # its failures are read by different people.
  #
  # No enclave needed — the portal runs in-process against in-memory stores and the fake
  # IdP. What this gate checks is the page, not the platform.
  a11y:
    name: accessibility (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra adapters --extra surfaces --extra portal --extra a11y

      # The axe ruleset is vendored and pinned in the tree; only the browser is fetched.
      - name: Install browser
        run: uv run --extra a11y playwright install --with-deps chromium

      # A green run here is NOT a conformance claim. The criteria automation cannot assert
      # are enumerated in specs/012-conversational-portal/contracts/conformance-portal.md
      # with a named human runner — and that record is itself asserted by a row in this lane.
      - name: Accessibility gate
        run: uv run --extra adapters --extra surfaces --extra portal --extra a11y pytest tests/a11y -q
