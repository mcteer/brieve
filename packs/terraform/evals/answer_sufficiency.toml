# terraform pack — answer_sufficiency suite (046). Five cases at the floor.
#
# Same load/score rules as vault (Principle VII): both packs ship the suite. Locator-shaped
# omissions fail; including the fact passes.

[[cases]]
id = "terraform-answer-sufficiency-omit-001"
suite = "answer_sufficiency"
prompt = "What should happen when a Terraform application server node fails?"
must_contain = ["automatically replace"]
recorded = '{"answer": "The Terraform operating guide covers backup and recovery for application servers.", "citations": [{"path": "/validated-designs/terraform-operating-guides-adoption/backup", "anchor": "application-server"}]}'

[[cases]]
id = "terraform-answer-sufficiency-include-001"
suite = "answer_sufficiency"
prompt = "What should happen when a Terraform application server node fails?"
must_contain = ["automatically replace"]
recorded = '{"answer": "We recommend you automatically replace application server nodes when a node or availability zone fails.", "citations": [{"path": "/validated-designs/terraform-operating-guides-adoption/backup", "anchor": "application-server"}]}'

