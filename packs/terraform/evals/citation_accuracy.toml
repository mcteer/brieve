# SPDX-License-Identifier: Apache-2.0
# terraform pack — citation_accuracy suite. Five cases at the floor, refused at load below it.
#
# **REAUTHORED BY 024, and the reason matters.** These cases used to carry `recorded` strings
# citing `developer.hashicorp.com/terraform/language/style` and similar — HashiCorp's general
# product documentation. The corpus this platform pins is `/validated-patterns/`, thirty-three
# tutorials. The two sets are **completely disjoint**, so every case cited a document the platform
# does not have and nobody had noticed, because `FixtureScorer` replayed the string without ever
# resolving a citation.
#
# `recorded` is now what a MODEL said. The product path resolves each citation against the pinned
# corpus, drops any claim that does not resolve, and declines if nothing survives — and the suite
# scores that. A case citing a section that does not exist now fails, which is the whole point.
[[cases]]
id = "terraform-citation-accuracy-001"
suite = "citation_accuracy"
prompt = "How should a platform landing zone be separated from workload landing zones?"
expected = "cited"
recorded = "Separate the platform landing zone from workload landing zones, per https://developer.hashicorp.com/validated-patterns/terraform/build-aws-lz-with-terraform#platform-landing-zone — workloads land in their own accounts."

[[cases]]
id = "terraform-citation-accuracy-002"
suite = "citation_accuracy"
prompt = "What design principles guide an AWS landing zone built with Terraform?"
expected = "cited"
recorded = "The pattern sets out design principles for the landing zone, per https://developer.hashicorp.com/validated-patterns/terraform/build-aws-lz-with-terraform#design-principles."

[[cases]]
id = "terraform-citation-accuracy-003"
suite = "citation_accuracy"
prompt = "How is infrastructure as code positioned in the landing zone pattern?"
expected = "cited"
recorded = "Infrastructure as code is treated as foundational, per https://developer.hashicorp.com/validated-patterns/terraform/build-aws-lz-with-terraform#infrastructure-as-code-iac."

[[cases]]
id = "terraform-citation-accuracy-004"
suite = "citation_accuracy"
prompt = "How does Terraform integrate with ServiceNow for request-driven runs?"
expected = "cited"
recorded = "Runs are integrated with ServiceNow requests, per https://developer.hashicorp.com/validated-patterns/terraform/automate-deployments-with-hcp-terraform-and-servicenow-catalog#integrate-terraform-runs-with-servicenow-requests."

[[cases]]
id = "terraform-citation-accuracy-005"
suite = "citation_accuracy"
prompt = "What does the ServiceNow catalog pattern say about validated architecture?"
expected = "cited"
recorded = "The validated architecture is described at https://developer.hashicorp.com/validated-patterns/terraform/automate-deployments-with-hcp-terraform-and-servicenow-catalog#validated-architecture."
