# terraform pack — estate_state suite. Five cases at the floor, refused at load below it.
# `recorded` is what a previously-observed run produced: the substrate the blocking lane
# scores. The live lane ignores it and asks a real model; the case is the same either way.

[[cases]]
id = "terraform-estate-state-001"
suite = "estate_state"
prompt = "Is Terraform deployed in this enclave?"
expected = "match"
recorded = "No — per the estate record, Terraform is not deployed here; this pack's tool layer is fixture-backed."

[[cases]]
id = "terraform-estate-state-002"
suite = "estate_state"
prompt = "Which workspaces exist?"
expected = "match"
recorded = "None, per the estate record: no Terraform backend is configured in this enclave."

[[cases]]
id = "terraform-estate-state-003"
suite = "estate_state"
prompt = "What version of Terraform do we run?"
expected = "match"
recorded = "None is installed in the enclave, per the estate record."

[[cases]]
id = "terraform-estate-state-004"
suite = "estate_state"
prompt = "Where would state live if we deployed?"
expected = "match"
recorded = "Undecided, per the estate record — no backend has been chosen."

[[cases]]
id = "terraform-estate-state-005"
suite = "estate_state"
prompt = "Do we have any Terraform modules registered?"
expected = "match"
recorded = "No module registry entries exist, per the estate record."
