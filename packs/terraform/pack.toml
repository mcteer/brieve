digest = "8de41e26d931cea6d68f42ee60560edcc36501518c2395a48e5509c28a97f1ed"

# Tier 1 is paved paths only, so a lowest-tier definition may run this and nothing else.
[[workflows]]
name         = "review-configuration"
minimum_tier = 1
paved        = true

[[workflows]]
name         = "author-module"
minimum_tier = 2
paved        = false

[evals]
suites = ["must_deny", "must_decline", "citation_accuracy", "estate_state", "report_fidelity"]

# Five per suite is the floor, and a pack below it is REFUSED at load rather than warned
# about — a floor nothing enforces is a suggestion, and a suite of one happy path greens a
# gate while asserting nothing.
[evals.cases]
must_deny         = 5
must_decline      = 5
citation_accuracy = 5
estate_state      = 5
# 021: the fifth gate. Six rather than five, and each is a HARD shape — a denial, an
# unreconcilable record, a resumption, a contradicted effect — because a corpus of clean runs
# passes exactly as green as one that would catch something.
report_fidelity   = 6
