# SPDX-License-Identifier: Apache-2.0
#
# The ADOPTED pack. Its skills come from hashicorp/agent-skills at a pinned commit, which
# is what gives ADR-0004's supply chain a genuine subject — real provenance to check, a real
# upstream version to pin, and content somebody else wrote to run an injection lens over.
#
# **Terraform is not deployed in the enclave**, so this pack's TOOL layer is fixture-backed
# and the record says so (FR-027c). The tool half is what Principle II governs, so a pack
# whose tools were never called must not read as one whose tools were. Its eval status and
# its tool reachability are separate facts, and a row asserts they stay that way.

# PRODUCT_MODE IS "none", AND THE FIRST DISPATCH TAUGHT WHY. These tools run on the
# ALLOCATION'S platform identity — the workload logs into Vault as itself and reads the
# agent secret space. `federate` means the USER'S identity is carried into the product,
# which is ADR-0044's credential translation and RFC 8693 territory: explicitly out of
# 013's scope. Declaring federate anyway made the entitlement mirror refuse the first
# real invoke — the governance layer correctly catching a manifest that claimed
# user-identity semantics for a platform-identity tool. `product` stays declared, because
# reachability monitoring and the dependency gate key on it, and neither is about whose
# identity a call carries.

[pack]
name       = "terraform"
product    = "terraform"
version    = "0.1.0"
provenance = "adopted"
# Fixture-backed, because Terraform does not run here. Named rather than omitted: a pack
# reaching a product with no probe records UNHEALTHY, and every one of its tools would then
# be denied `dependency_unavailable` naming a product that is simply absent.
probe = "terraform_probe"

[upstream]
repository = "https://github.com/hashicorp/agent-skills"
commit     = "8c6573abbd21e8094fab8f538eb5f97db63133fd"
licence    = "MPL-2.0"
retrieved  = "2026-08-03"

# Transport is MCP because a mature server exists — `hashicorp/terraform-mcp-server`, which
# upstream's own plugin manifest declares. Principle II: transport is a tool PROPERTY, and
# authoring an MCP server merely for protocol uniformity is never required. Here one exists,
# so it is used; the Vault pack goes native for the same rule read the other way.
[[tools]]
name           = "terraform_plan"
risk_class     = "read"
transport      = "mcp"
handler        = "terraform_plan"
product        = "terraform"
repeatable     = true

[[tools]]
name       = "terraform_apply"
risk_class = "destructive"
transport  = "mcp"
handler    = "terraform_apply"
# Non-repeatable, therefore an observer is REQUIRED — the loader refuses `observer_required`
# without one. An apply that was interrupted mid-flight resolves to CANNOT_DETERMINE and
# parks the run unless something can go and find out what actually happened.
observer       = "terraform_apply_observer"
product        = "terraform"
repeatable     = false

[[skills]]
name    = "terraform-style-guide"
path    = "skills/terraform-style-guide/SKILL.md"
version = "8c6573abbd21e8094fab8f538eb5f97db63133fd"
digest  = "fea8a0eadf68f1ac45cae3b1d6dc4c66b489fb6e40a3d41762120059c49540c2"
# Reviewed against these exact bytes (051, FR-019). A bump changes `digest`; leaving
# this behind refuses the load, so nobody can bump the content without re-reading what
# it now recommends that this platform has no registry tool for.
unsatisfiable_reviewed_at = "fea8a0eadf68f1ac45cae3b1d6dc4c66b489fb6e40a3d41762120059c49540c2"
# BOUND TO PLAN, WRITE AND JUDGE (051, FR-012).
#
# Plan is bound because its output is Write's instruction. The paths and intent Plan names
# are what Write then works from, so a plan formed without the skills can direct Write toward
# something the skills would not sanction — and Write receiving them does not undo a
# direction it was told to take. This is not about what Plan emits; Plan emits no HCL.
#
# Research and Propose are not bound, and their prose no longer claims otherwise.
phases = ["plan", "write", "judge"]

[[skills]]
name    = "terraform-style-guide-security"
path    = "skills/terraform-style-guide/SECURITY.md"
version = "8c6573abbd21e8094fab8f538eb5f97db63133fd"
digest  = "3dc8ffa10139e9772c5c102fee6377f66f5167bd043a7c43e6e5df682dc75f92"
# Reviewed against these exact bytes (051, FR-019). A bump changes `digest`; leaving
# this behind refuses the load, so nobody can bump the content without re-reading what
# it now recommends that this platform has no registry tool for.
unsatisfiable_reviewed_at = "3dc8ffa10139e9772c5c102fee6377f66f5167bd043a7c43e6e5df682dc75f92"
# BOUND TO PLAN, WRITE AND JUDGE (051, FR-012).
#
# Plan is bound because its output is Write's instruction. The paths and intent Plan names
# are what Write then works from, so a plan formed without the skills can direct Write toward
# something the skills would not sanction — and Write receiving them does not undo a
# direction it was told to take. This is not about what Plan emits; Plan emits no HCL.
#
# Research and Propose are not bound, and their prose no longer claims otherwise.
phases = ["plan", "write", "judge"]

# 049 executed phase instructions. Digests are SHA-256 of AGENTS.md.
# 0.2.0: production-shaped set after individual GEPA (Write SC-006 5/5).
[[agents]]
phase   = "research"
path    = "agents/research/AGENTS.md"
version = "0.3.0"
digest = "772b36b68bb5f1199aa0edf7fcaf550182d11885849e57d233a14af26f356136"

[[agents]]
phase   = "plan"
path    = "agents/plan/AGENTS.md"
version = "0.3.0"
digest = "2f8f0f3aa886724cc77a8020d10637f6b76c4a1f27f0b8f1a554825c1edb8e33"

[[agents]]
phase   = "write"
path    = "agents/write/AGENTS.md"
version = "0.3.0"
digest = "a828b828d41348edfa483138442b6196bdcb053e70a188f72c19b9b1999721d6"

[[agents]]
phase   = "judge"
path    = "agents/judge/AGENTS.md"
version = "0.3.0"
digest = "4290a0bdca1d4434bce0bc5e4fc8a9f1a797a73f9d38659f62b6ba7dc745d7b4"

[[agents]]
phase   = "propose"
path    = "agents/propose/AGENTS.md"
