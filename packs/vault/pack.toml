# SPDX-License-Identifier: Apache-2.0
#
# The AUTHORED pack, and the one whose tools reach a product that actually answers.
#
# Vault runs in the enclave, so this is where Principle II's claim gets exercised end to
# end: a pack tool registered like any other, reaching a live product through the same hook
# pipeline. The Terraform pack proves adoption; this one proves invocation. Neither alone
# exercises both halves of ADR-0004, which is why there are two.
#
# Authored under ADR-0004's "genuine gap" provision: upstream covers Terraform and Packer
# and lists Vault as a future product. The skills use the SAME open Agent Skills format
# upstream uses (FR-027d), so contributing them back is a pull request rather than a
# rewrite — which makes authoring here a temporary state by design rather than a fork.

# PRODUCT_MODE IS "none", AND THE FIRST DISPATCH TAUGHT WHY. These tools run on the
# ALLOCATION'S platform identity — the workload logs into Vault as itself and reads the
# agent secret space. `federate` means the USER'S identity is carried into the product,
# which is ADR-0044's credential translation and RFC 8693 territory: explicitly out of
# 013's scope. Declaring federate anyway made the entitlement mirror refuse the first
# real invoke — the governance layer correctly catching a manifest that claimed
# user-identity semantics for a platform-identity tool. `product` stays declared, because
# reachability monitoring and the dependency gate key on it, and neither is about whose
# identity a call carries.

[pack]
name       = "vault"
product    = "vault"
version    = "0.1.0"
provenance = "authored"
# No [upstream] table, and that is what `authored` means. The loader refuses an `adopted`
# pack without one, because a supply chain with no pinned commit has nothing to check.
probe = "vault_probe"

# Native transport, not MCP. The rule read the other way from the Terraform pack: MCP where
# a mature server exists, native otherwise. No mature Vault MCP server exists, and Principle
# II says authoring one merely for protocol uniformity is never required.
[[tools]]
name       = "vault_read"
risk_class = "secret_touching"
# WHAT THIS TOOL REACHES. `{agent_space}` is the agent's own secret space, whatever its
# ceiling grants — and the honest answer here is "all of it", because the path is an argument
# the agent supplies at call time. A tool shaped like this is telling you breadth is the
# point, which for a HashiCorp-expert agent gathering context it is (ADR-0057).
#
# Declared for review rather than enforcement: nothing reads this at runtime.
paths      = [{ path = "{agent_space}", capabilities = ["read"] }]
transport  = "native"
handler    = "vault_read"
# `secret_touching` is the risk class registry review may demand process isolation for
# (Principle II) — a provision that has never been actionable because nothing in this
# platform could tell a secret-touching tool from any other until 013 added the field.
product        = "vault"
repeatable     = true

[[tools]]
name       = "vault_write"
risk_class = "secret_touching"
# Write needs `create` and `update`: a KV v2 put is an update to an existing version and a
# create when there is none, and a grant naming only one of them fails on whichever case
# happens to arrive first.
paths      = [{ path = "{agent_space}", capabilities = ["create", "update"] }]
transport  = "native"
handler    = "vault_write"
# Non-repeatable: a CAS write that succeeded and then lost its response must not be
# replayed. The observer is what makes an interrupted write resolvable by OBSERVATION
# rather than by assumption, and the loader refuses without one.
observer       = "vault_write_observer"
product        = "vault"
repeatable     = false

# ── 042: policy authoring ────────────────────────────────────────────────────────────────
#
# Two tools, and the second is the feature. Reading policy is ordinary; MEASURING the impact
# of a proposed one is what makes a change proposal worth reviewing, and Vault has no
# plan-equivalent — so the platform writes the proposed document under a throwaway name, mints
# a token carrying only it, and asks Vault's own `sys/capabilities`. The product answers.

[[tools]]
name       = "vault_policy_read"
risk_class = "secret_touching"
# Policy STRUCTURE, never secret values — `sys/policies/acl` and attachment metadata are the
# entire surface, so `vault_read`'s "the value belongs in the process that consumes it, not in
# the reasoning about it" holds here by construction rather than by filtering.
#
# Declared for review rather than enforcement, as the tools above are.
paths      = [{ path = "sys/policies/acl", capabilities = ["read", "list"] }]
transport  = "native"
handler    = "vault_policy_read"
product    = "vault"
repeatable = true

[[tools]]
name       = "vault_policy_impact"
risk_class = "secret_touching"
paths      = [{ path = "sys/policies/acl/scratch-agent-*", capabilities = ["create", "update", "delete", "read"] }]
transport  = "native"
handler    = "vault_policy_impact"
product    = "vault"
# REPEATABLE, and the precedent points the other way — `vault_write` is non-repeatable because
# a CAS write that succeeded and lost its response must be resolved by observation, not replay.
#
# This tool's contract is that it leaves NOTHING behind: re-running it overwrites its own
# derived scratch names, re-answers, and re-destroys. So a replay after interruption *heals*
# the orphan the interruption created, and declaring it non-repeatable would demand an observer
# whose only honest answer — "did a transient thing that no longer exists happen?" — is useless
# to a resumer.
repeatable = true

[[skills]]
name    = "vault-secret-access"
path    = "skills/vault-secret-access/SKILL.md"
version = "0.1.0"
digest  = "b3815739e32a0b1578b04b863a890d91b5c925259a19ed8f283c2e91de5f9d81"
# Reviewed against these exact bytes (051, FR-019). A bump changes `digest`; leaving
# this behind refuses the load, so nobody can bump the content without re-reading what
# it now recommends that this platform has no registry tool for.
unsatisfiable_reviewed_at = "b3815739e32a0b1578b04b863a890d91b5c925259a19ed8f283c2e91de5f9d81"

# 049 executed phase instructions. Digests are SHA-256 of AGENTS.md.
# 0.2.0: production-shaped set after individual GEPA (no grading overlay).
[[agents]]
phase   = "research"
path    = "agents/research/AGENTS.md"
version = "0.2.0"
digest = "5031d22d3c79f8fa9d8141383384ee489cd8ff52aab062e4eabacc701268b0b0"

[[agents]]
phase   = "plan"
path    = "agents/plan/AGENTS.md"
version = "0.2.0"
digest = "3a4975f0520ded7483f92ce89680f7bcb5e5270e261b4e4165809292cccd7ef4"

[[agents]]
phase   = "write"
path    = "agents/write/AGENTS.md"
version = "0.2.0"
digest = "67aa9d1263586b84087a63275aa5c7818b0e134adfb6c9a348ab8722be8b257c"

[[agents]]
phase   = "judge"
path    = "agents/judge/AGENTS.md"
version = "0.2.0"
digest = "6cc5b013591709fc6db5e6b7e88d5e75cc112cf137e32243b5a12fd6e9ed9d78"

[[agents]]
phase   = "propose"
path    = "agents/propose/AGENTS.md"
version = "0.2.0"
digest = "2a30184034c3a9fde60f2ef1e4b2cb4d809226cfaaf88eb03e3bb1ab36bcf0ca"

# At least one PAVED workflow, so US5 has something a lowest-tier definition may actually
# run. A tier bound with nothing beneath it would assert a refusal against an empty set.
[[workflows]]
name         = "read-configuration"
minimum_tier = 1
paved        = true

[[workflows]]
name         = "rotate-credential"
minimum_tier = 3
paved        = false

# 042. **Without this declaration nothing in the feature runs**: 041's request validation
# refuses `pack_declares_no_authoring` for any pack that has not said it supports authoring,
# which is one of the three independent gates ADR-0038 put on who may author for what.
#
# `minimum_tier = 3` and NOT paved. Authoring a policy reaches a hardened tier, opens a real
# pull request against somebody's repository, and writes to the product to measure itself —
# none of which belongs to a lowest-tier definition, and none of which is a well-trodden path
# whose outcome a reviewer can assume.
[[workflows]]
name         = "policy-authoring"
minimum_tier = 3
paved        = false

[evals]
suites = ["must_deny", "must_decline", "citation_accuracy", "estate_state", "report_fidelity"]

[evals.cases]
must_deny         = 5
must_decline      = 5
citation_accuracy = 5
estate_state      = 5
# 021: the fifth gate. Six rather than five, and each is a HARD shape — a denial, an
# unreconcilable record, a resumption, a contradicted effect — because a corpus of clean runs
# passes exactly as green as one that would catch something.
report_fidelity   = 6
