# SPDX-License-Identifier: Apache-2.0
# vault pack — estate_state suite. Five cases at the floor, refused at load below it.
#
# **REAUTHORED BY 025, and the old cases were the last of a known defect.** They asked *"which
# secrets engines are mounted?"* and *"which auth methods are enabled?"* — live product
# configuration the evidence plane does not hold. They were authored in 013 for a capability that
# did not exist, which is the same defect 024 removed for `citation_accuracy` and `must_decline`;
# this suite was the last one still carrying it.
#
# FR-012's run named the concrete cost: `vault-estate-state-004` failed because the live lane's
# "estate record" was five unlabelled sentences and the model correctly refused to guess which one
# answered the question. See contracts/conformance.md § FR-012 finding.
#
# `recorded` is what a MODEL proposed. `events` is the expected reference set — the records a
# faithful answer must rest on, named by their AUTHORED id from estate_records.toml. Scoring is
# precision and recall over the references that survive the product path, so an invented reference
# fails and an omitted one fails; the old `match` substring could do neither.

#
# `asker_role` (030) is WHO COULD ASK each case, and the tag follows the case's expected set
# rather than its prompt: 002 reads as an operator's question and expects rec-vault-002 — an
# authority_denied record no operator can see — so it is a compliance-analyst case, whatever its
# wording. The scorer narrows the fixture to the declared role's visibility before the answering
# function runs, so a mis-tagged case refuses to load rather than passing on records production
# would withhold.
#
# WHAT THIS SUITE STILL DOES NOT EXERCISE, stated because an unstated gap of exactly this kind is
# what produced 030: the governed read and its access record, temporal window resolution, and the
# per-type bound (029) — a five-record fixture could not exercise a bound in any case.

[[cases]]
id = "vault-estate-state-001"
asker_role = "compliance-analyst"
suite = "estate_state"
prompt = "Which runs were denied?"
recorded = "Authority was denied during the nightly apply, per rec-vault-002."
events = ["rec-vault-002"]

[[cases]]
id = "vault-estate-state-002"
asker_role = "compliance-analyst"
suite = "estate_state"
prompt = "What happened during the nightly apply run?"
recorded = "The run started, a read was allowed, and a write was denied — per rec-vault-001, rec-vault-003 and rec-vault-002."
events = ["rec-vault-001", "rec-vault-002", "rec-vault-003"]

[[cases]]
id = "vault-estate-state-003"
asker_role = "compliance-analyst"
suite = "estate_state"
prompt = "Who was granted write authority?"
recorded = "A write grant was issued to bob during the rotation run, per rec-vault-004."
events = ["rec-vault-004"]

[[cases]]
id = "vault-estate-state-004"
asker_role = "operator"
suite = "estate_state"
prompt = "Which runs stopped, and why?"
recorded = "The rotation run stopped at operator request, per rec-vault-005."
events = ["rec-vault-005"]

# The CONTROL PAIR (analysis P2-3), first half: a control the records show produced no violation.
# Its partner (a control nobody evaluated, which must DECLINE) lives in the component rows,
# because this suite structurally cannot carry decline cases: `events` is required non-empty,
# since fidelity over an empty expected set passes vacuously.
#
# **A NEGATIVE CLAIM NEEDS BOTH KINDS OF RECORD, and the first live run taught us that.** This
# case originally expected only the allowed read, and the model failed it by citing MORE: the
# denial that exists (showing it was a write, not a read) alongside the read that succeeded. That
# is the correct evidence set — proving nothing of a kind happened means showing what did happen
# of that kind and that none of it matches. The model was right; the case was wrong.
[[cases]]
id = "vault-estate-state-005"
asker_role = "compliance-analyst"
suite = "estate_state"
prompt = "Were any reads denied during the nightly apply?"
recorded = "The only denial in that run was a write, per rec-vault-002, and the read was allowed, per rec-vault-003."
events = ["rec-vault-002", "rec-vault-003"]
