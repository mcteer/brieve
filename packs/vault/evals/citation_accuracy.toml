# vault pack — citation_accuracy suite. Five cases at the floor, refused at load below it.
#
# **REAUTHORED BY 024.** These cited `developer.hashicorp.com/vault/docs/...` — general product
# documentation — while the pinned corpus is `/validated-patterns/`. Disjoint sets, so every case
# cited a document the platform does not have, and nothing noticed because `FixtureScorer`
# replayed the string without resolving anything.
#
# `recorded` is what a MODEL said. The product path resolves each citation against the pin.
[[cases]]
id = "vault-citation-accuracy-001"
suite = "citation_accuracy"
prompt = "How does an AI agent obtain an identity with Vault?"
expected = "cited"
recorded = "The authentication flow is set out at https://developer.hashicorp.com/validated-patterns/vault/ai-agent-identity-with-hashicorp-vault#detailed-authentication-flow."

