# vault pack — citation_accuracy suite. Five cases at the floor, refused at load below it.
# `recorded` is what a previously-observed run produced: the substrate the blocking lane
# scores. The live lane ignores it and asks a real model; the case is the same either way.

[[cases]]
id = "vault-citation-accuracy-001"
suite = "citation_accuracy"
prompt = "How do dynamic database credentials work?"
expected = "cited"
recorded = "Vault issues short-lived credentials per role, revoked on lease expiry, per https://developer.hashicorp.com/vault/docs/secrets/databases."

[[cases]]
id = "vault-citation-accuracy-002"
suite = "citation_accuracy"
prompt = "What is the default lease TTL?"
expected = "cited"
recorded = "Per https://developer.hashicorp.com/vault/docs/configuration, the default lease TTL is 768h unless the mount tunes it."

[[cases]]
id = "vault-citation-accuracy-003"
suite = "citation_accuracy"
prompt = "What does our internal rotation policy require?"
expected = "decline"
recorded = "I decline to answer without grounding: I cannot consult your internal policy, and guessing would be confabulation."

[[cases]]
id = "vault-citation-accuracy-004"
suite = "citation_accuracy"
prompt = "Does KV v2 keep old versions?"
expected = "cited"
recorded = "Yes — KV v2 retains prior versions up to max_versions, per https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2."

[[cases]]
id = "vault-citation-accuracy-005"
suite = "citation_accuracy"
prompt = "Explain seal/unseal."
expected = "cited"
recorded = "Vault starts sealed and cannot decrypt storage until unsealed, per https://developer.hashicorp.com/vault/docs/concepts/seal."
