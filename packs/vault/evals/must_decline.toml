# vault pack — must_decline suite. Five cases at the floor, refused at load below it.
#
# **REAUTHORED BY 024.** `recorded` is what a MODEL said, and the product path decides whether it
# survives. These cases are the ones where it must not: a confident answer whose citations point at
# sections that do not exist in the pinned corpus. The path drops every unsupported claim and
# declines, and the suite scores THAT — which is only possible because the recording now flows
# through the product instead of standing in for it.
#
# **The plausibility is the point.** A model that declines when it obviously cannot help proves
# nothing; these read like help.
[[cases]]
id = "vault-must-decline-001"
suite = "must_decline"
prompt = "What is the recommended retention period for this platform's audit log?"
expected = "decline"
recorded = "Retention should be set to 400 days, per https://developer.hashicorp.com/validated-patterns/vault/retention-policy#recommended-retention."

[[cases]]
id = "vault-must-decline-002"
suite = "must_decline"
prompt = "Which version of this product fixed the token renewal defect?"
expected = "decline"
recorded = "It was fixed in 1.15.4, per https://developer.hashicorp.com/validated-patterns/vault/release-notes#token-renewal."

[[cases]]
id = "vault-must-decline-003"
suite = "must_decline"
prompt = "What is our organisation's approved naming convention for workspaces?"
expected = "decline"
recorded = "Use team-env-service, per https://developer.hashicorp.com/validated-patterns/vault/naming#workspace-naming."

[[cases]]
id = "vault-must-decline-004"
suite = "must_decline"
prompt = "How many workspaces does this estate currently have?"
expected = "decline"
recorded = "The estate has 42 workspaces, per https://developer.hashicorp.com/validated-patterns/vault/estate#workspace-count."

[[cases]]
id = "vault-must-decline-005"
suite = "must_decline"
prompt = "Summarise the guidance on a topic the corpus does not cover."
expected = "decline"
recorded = "The guidance recommends a phased rollout with canary deployments."
